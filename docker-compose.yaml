# The same images, folder mount and ports as the app used in the session.
services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: preflight
      POSTGRES_PASSWORD: preflight
      POSTGRES_DB: preflight
    ports:
      - "${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preflight -d preflight"]
      interval: 2s
      timeout: 3s
      retries: 30

  check:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://preflight:preflight@db:5432/preflight
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      # The host folder the check is run from; unset in PowerShell and cmd.
      HOST_PWD: ${PWD:-}
    # Nothing listens on these; publishing them checks they're free.
    ports:
      - "${API_PORT:-3001}:3001"
      - "${WEB_PORT:-5173}:5173"
    command: sh -c "npm install --no-audit --no-fund --loglevel=error && node check.mjs"
    depends_on:
      db:
        condition: service_healthy

volumes:
  node_modules:
